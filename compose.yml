services:
  redis:
    image: redis:7
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_USER: app
      POSTGRES_DB: shortener
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: ["/app/api"]
    ports:
      - "8003:8003"
    environment:
      REDIS_ADDR: redis:6379
      PORT: "8003"
      JWT_SECRET: ${JWT_SECRET_KEY}
      DATABASE_URL: "postgres://app:${POSTGRES_PASSWORD}@postgres:5432/shortener?sslmode=disable"
      ACCESS_EXPIRATION: "900"
      REFRESH_EXPIRATION: "604800"
    depends_on:
      - redis
      - postgres

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      DATABASE_URL: "postgres://app:${POSTGRES_PASSWORD}@postgres:5432/shortener?sslmode=disable"
      REDIS_ADDR: redis:6379
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
