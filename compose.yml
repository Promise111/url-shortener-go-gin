services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: app
      POSTGRES_DB: shortener
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: ["/app/api"]
    ports:
      - "8003:8003"
    environment:
      REDIS_ADDR: redis:6379
      PORT: "8003"
      JWT_SECRET: "POn5TSfXf_8f>am!bpHb9_XF.jfupl=;e_6cBr$TeBMOK52knzC|mxCQHV62p+Ogdf5S99|U+E,8^gg)s_Cq#)"
      DATABASE_URL: postgres://app:secret@postgres:5432/shortener?sslmode=disable
      ACCESS_EXPIRATION: "900"
      REFRESH_EXPIRATION: "604800"
    depends_on:
      - redis
      - postgres

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://app:secret@postgres:5432/shortener?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
    
