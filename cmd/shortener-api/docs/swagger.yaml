basePath: /
definitions:
  handler.CreateLinkRequest:
    properties:
      expires_at:
        example: "2027-04-08T00:00:00Z"
        format: date-time
        type: string
      long_url:
        example: https://example.com
        maxLength: 2048
        type: string
      max_clicks:
        example: 100
        minimum: 5
        type: integer
      short_code:
        example: docs
        maxLength: 20
        minLength: 3
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.Status'
        enum:
        - active
        - disabled
        example: disabled
    required:
    - long_url
    type: object
  handler.CreateLinkResponse:
    properties:
      data:
        $ref: '#/definitions/handler.LinkSample'
      message:
        example: Link created successfully!
        type: string
      status:
        example: true
        type: boolean
    type: object
  handler.CreateUserResponse:
    properties:
      data:
        $ref: '#/definitions/handler.UserSample'
      message:
        example: User created successfully.
        type: string
      status:
        example: true
        type: boolean
    type: object
  handler.GenerateAccessRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyNzkxNDg2NzgzLCJpZCI6IjUxMWE3NDNhLWFlNGItNGZhMC1hYjQzLTUxOTM3ZTUxMGM2OSIsInVzZ0.n5vU3bqtslWmIlCxlUNOlpb9V_CxXWHgM53Ha2ZbmNY
        type: string
    required:
    - refresh_token
    type: object
  handler.GenerateAccessResponse:
    properties:
      data:
        $ref: '#/definitions/handler.GenerateAccessResponseData'
      message:
        example: Access token generated successfully
        type: string
      status:
        example: true
        type: boolean
    type: object
  handler.GenerateAccessResponseData:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyNzkxNDg2NzgzLCJpZCI6IjUxMWE3NDNhLWFlNGItNGZhMC1hYjQzLTUxOTM3ZTUxMGM2OSIsInVzZ0.n5vU3bqtslWmIlCxlUNOlpb9V_CxXWHgM53Ha2ZbmNY
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFzkxNDg2NzgzLCJpZCI6IjUxMWE3NDNhLWFlNGItNGZhMxMGM2OSIsInVzZXJuYW1lIjoicmFuZG9tZ2VlIn0.n5vU3bqUNOlpb9V_CxXWHgM53Ha2ZbmNY
        type: string
    type: object
  handler.GetLinkResponse:
    properties:
      data:
        $ref: '#/definitions/handler.LinkSample'
      message:
        example: Records fetched successfully!
        type: string
      status:
        example: true
        type: boolean
    type: object
  handler.GetLinksResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.LinkSample'
        type: array
      limit:
        example: 10
        type: integer
      message:
        example: Link created successfully!
        type: string
      page:
        example: 1
        type: integer
      status:
        example: true
        type: boolean
      total:
        example: 100
        type: integer
      totalPage:
        example: 10
        type: integer
    type: object
  handler.HealthResponse:
    properties:
      message:
        example: "\U0001F4AA Shortener API is up and running!"
        type: string
      status:
        example: true
        type: boolean
    type: object
  handler.LinkSample:
    properties:
      clicks:
        example: 10
        type: integer
      created_at:
        example: "2026-02-02T00:00:00Z"
        type: string
      expires_at:
        example: "2027-04-08T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      long_url:
        example: https://facebook.com
        type: string
      max_clicks:
        example: 50
        type: integer
      short_code:
        example: 6aAwoxoksd
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.Status'
        example: disabled
      updated_at:
        example: "2026-09-11T00:00:00Z"
        type: string
      user_id:
        example: b88a21e7-8524-428f-a109-f9eefdab3129
        type: string
    type: object
  handler.LoginResponse:
    properties:
      data:
        $ref: '#/definitions/handler.LoginResponseData'
      status:
        example: true
        type: boolean
    type: object
  handler.LoginResponseData:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyNzkxNDg2NzgzLCJpZCI6IjUxMWE3NDNhLWFlNGItNGZhMC1hYjQzLTUxOTM3ZTUxMGM2OSIsInVzZ0.n5vU3bqtslWmIlCxlUNOlpb9V_CxXWHgM53Ha2ZbmNY
        type: string
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFzkxNDg2NzgzLCJpZCI6IjUxMWE3NDNhLWFlNGItNGZhMxMGM2OSIsInVzZXJuYW1lIjoicmFuZG9tZ2VlIn0.n5vU3bqUNOlpb9V_CxXWHgM53Ha2ZbmNY
        type: string
      user:
        $ref: '#/definitions/handler.UserSample'
    type: object
  handler.LoginUserRequest:
    properties:
      email:
        example: hello@hi.com
        type: string
      password:
        example: '****************'
        maxLength: 72
        minLength: 8
        type: string
      username:
        example: randomgee
        maxLength: 30
        minLength: 3
        type: string
    required:
    - password
    type: object
  handler.RegisterUserRequest:
    properties:
      email:
        example: hello@hi.com
        type: string
      password:
        example: myPass123
        maxLength: 72
        minLength: 8
        type: string
      username:
        example: randomgee
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  handler.ResendEmailVerificationTokenRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handler.ResendEmailVerificationTokenResponse:
    properties:
      message:
        example: Verification code resent successfully
        type: string
      status:
        example: true
        type: boolean
    type: object
  handler.RevokeAccessResponse:
    properties:
      message:
        example: Refresh token revoked successfully
        type: string
      status:
        example: true
        type: boolean
    type: object
  handler.RevokeRefreshRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyNzkxNDg2NzgzLCJpZCI6IjUxMWE3NDNhLWFlNGItNGZhMC1hYjQzLTUxOTM3ZTUxMGM2OSIsInVzZ0.n5vU3bqtslWmIlCxlUNOlpb9V_CxXWHgM53Ha2ZbmNY
        type: string
    required:
    - refresh_token
    type: object
  handler.UpdateLinkRequest:
    properties:
      expires_at:
        example: "2027-08-08T10:58:29Z"
        format: date-time
        type: string
      long_url:
        example: https://facebook.com
        maxLength: 2048
        type: string
      max_clicks:
        example: 50
        format: int64
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/model.Status'
        enum:
        - active
        - disabled
    type: object
  handler.UpdateLinkResponse:
    properties:
      data:
        $ref: '#/definitions/handler.LinkSample'
      message:
        example: Link updated successfully!
        type: string
      status:
        example: true
        type: boolean
    type: object
  handler.UserSample:
    properties:
      created_at:
        example: "2026-02-02T00:00:00Z"
        type: string
      deleted_at:
        example: ""
        type: string
      email:
        example: hello@hi.com
        type: string
      id:
        example: b0f7915c-5b4e-4c1a-8fc8-d6e9663f3709
        type: string
      updated_at:
        example: "2027-08-02T00:00:00Z"
        type: string
      username:
        example: randomgee
        type: string
    type: object
  handler.VerifyEmailResponse:
    properties:
      message:
        example: Email verified successfully
        type: string
      status:
        example: true
        type: boolean
    type: object
  model.Status:
    enum:
    - disabled
    - expired
    - active
    type: string
    x-enum-varnames:
    - StatusDisabled
    - StatusExpired
    - StatusActive
host: localhost:8003
info:
  contact:
    email: promiseihunna@gmail.com
    name: Promise
  description: API for creating and resolving shortened URLs.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: URL Shortener
  version: "1.0"
paths:
  /{shortCode}:
    get:
      description: Redirect the client to the original long URL
      parameters:
      - description: Short code
        in: path
        name: shortCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Temporary redirect to the long URL
          headers:
            Location:
              description: Destination long URL
              type: string
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "410":
          description: Gone
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Redirect by short code
      tags:
      - links
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login and return access + refresh JWTs (refresh hash persisted
        in DB)
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Login User
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Allow user logout and invalidate refresh token
      parameters:
      - description: Logout payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RevokeRefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RevokeAccessResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Logout
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Allow user generate access and refresh tokens
      parameters:
      - description: Generate access payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.GenerateAccessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GenerateAccessResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Generate Access and Refresh Tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create new user account
      parameters:
      - description: Create user payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateUserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register User
      tags:
      - auth
  /api/v1/auth/resend-verification:
    post:
      parameters:
      - description: User's email
        in: body
        name: email
        required: true
        schema:
          $ref: '#/definitions/handler.ResendEmailVerificationTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResendEmailVerificationTokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Resend verification token
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      description: Allow user verify email
      parameters:
      - description: Email verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.VerifyEmailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Verify Email
      tags:
      - auth
  /api/v1/health:
    get:
      description: Returns the health status of the shortener API.
      operationId: healthCheck
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health check
      tags:
      - health
  /api/v1/links:
    get:
      description: Fetch all links record
      parameters:
      - description: limit pagination records
        in: query
        name: limit
        type: string
      - description: specify pagination page
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GetLinksResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get links
      tags:
      - links
    post:
      consumes:
      - application/json
      description: Create new shortened URL
      parameters:
      - description: Create Link payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateLinkResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Shorten URL
      tags:
      - links
  /api/v1/links/{id}:
    delete:
      description: Delete link by id
      parameters:
      - description: Link ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete link
      tags:
      - links
    get:
      description: Fetch link by id
      parameters:
      - description: Link ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GetLinkResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get link by id
      tags:
      - links
    patch:
      consumes:
      - application/json
      description: Update link by id
      parameters:
      - description: Link id
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UpdateLinkResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update link
      tags:
      - links
  /api/v1/links/code/{shortCode}:
    get:
      description: Fetch link by short_code
      parameters:
      - description: Short code
        in: path
        name: shortCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GetLinkResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get link by shortCode
      tags:
      - links
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: 'Paste: Bearer <accessToken> (capital B, then a space, then the access
      JWT from login/refresh — not the refresh token)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
